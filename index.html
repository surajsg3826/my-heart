<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Heart</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    .heart-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Glow ring */
    .glow-ring {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 50, 100, 0.25) 0%, transparent 70%);
      animation: pulse-glow 1.2s ease-in-out infinite;
    }

    /* SVG heart */
    #heart-svg {
      width: 200px;
      height: 200px;
      animation: heartbeat 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255, 50, 100, 0.8))
              drop-shadow(0 0 40px rgba(255, 50, 100, 0.5));
      cursor: pointer;
    }

    #heart-path {
      fill: url(#heartGradient);
      transition: fill 0.3s;
    }

    @keyframes heartbeat {
      0%   { transform: scale(1); }
      14%  { transform: scale(1.2); }
      28%  { transform: scale(1); }
      42%  { transform: scale(1.12); }
      56%  { transform: scale(1); }
      100% { transform: scale(1); }
    }

    @keyframes pulse-glow {
      0%   { transform: scale(1);   opacity: 0.6; }
      50%  { transform: scale(1.4); opacity: 1;   }
      100% { transform: scale(1);   opacity: 0.6; }
    }

    /* Floating particles */
    .particle {
      position: absolute;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      animation: float-up 2.5s ease-out forwards;
    }

    @keyframes float-up {
      0%   { transform: translateY(0)   scale(0.5); opacity: 1; }
      100% { transform: translateY(-160px) scale(1.2); opacity: 0; }
    }

    /* Click ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(255, 80, 120, 0.8);
      animation: ripple-expand 0.8s ease-out forwards;
      pointer-events: none;
    }

    @keyframes ripple-expand {
      0%   { width: 20px; height: 20px; opacity: 1; }
      100% { width: 260px; height: 260px; opacity: 0; }
    }

    /* Beat count */
    .beat-counter {
      position: fixed;
      bottom: 30px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .beat-counter span {
      color: #ff3264;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="heart-container" id="container">
    <div class="glow-ring"></div>

    <svg id="heart-svg" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%"   stop-color="#ff6b8a" />
          <stop offset="50%"  stop-color="#ff1f4f" />
          <stop offset="100%" stop-color="#c0002e" />
        </linearGradient>
      </defs>
      <path id="heart-path"
        d="M50 85
           C50 85 5 55 5 28
           A20 20 0 0 1 50 20
           A20 20 0 0 1 95 28
           C95 55 50 85 50 85 Z"
      />
    </svg>
  </div>

  <div class="beat-counter">beats: <span id="beat-count">0</span></div>

  <script>
    const container = document.getElementById('container');
    const svg = document.getElementById('heart-svg');
    const beatCount = document.getElementById('beat-count');
    const heartPath = document.getElementById('heart-path');

    let beats = 0;

    // Count beats from animation
    svg.addEventListener('animationiteration', () => {
      beats++;
      beatCount.textContent = beats;
    });

    // Click effect
    svg.addEventListener('click', (e) => {
      spawnParticles();
      createRipple();
      boostHeart();
    });

    function boostHeart() {
      heartPath.style.fill = '#ff9900';
      setTimeout(() => {
        heartPath.style.fill = 'url(#heartGradient)';
      }, 300);
    }

    function createRipple() {
      const ripple = document.createElement('div');
      ripple.classList.add('ripple');
      container.appendChild(ripple);
      setTimeout(() => ripple.remove(), 800);
    }

    function spawnParticles() {
      const emojis = ['❤️', '💕', '💖', '💗', '💓', '💞', '✨'];
      const count = 6;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.classList.add('particle');
          p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          const angle = (i / count) * 360;
          const rad = angle * (Math.PI / 180);
          const spread = 60 + Math.random() * 40;
          p.style.left = (100 + Math.cos(rad) * spread) + 'px';
          p.style.top  = (100 + Math.sin(rad) * spread) + 'px';
          p.style.fontSize = (14 + Math.random() * 14) + 'px';
          container.appendChild(p);
          setTimeout(() => p.remove(), 2500);
        }, i * 60);
      }
    }

    // Auto-spawn particles every few beats
    setInterval(() => {
      if (Math.random() > 0.5) {
        const p = document.createElement('div');
        p.classList.add('particle');
        p.textContent = ['❤️', '💕', '✨'][Math.floor(Math.random() * 3)];
        p.style.left = (60 + Math.random() * 80) + 'px';
        p.style.top  = (60 + Math.random() * 80) + 'px';
        p.style.fontSize = (10 + Math.random() * 10) + 'px';
        container.appendChild(p);
        setTimeout(() => p.remove(), 2500);
      }
    }, 1200);
  </script>
</body>
</html>
